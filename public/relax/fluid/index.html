<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Потоки</title>
  <script src="dat.gui.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { overflow: hidden; background: #0a0a0f; width: 100%; height: 100%; position: fixed; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .dg.main, .dg.ac { display: none !important; }
    .promo { display: none !important; }
  </style>
  <script>
    /* Safety net: define isMobile before script.js runs */
    window.ga = function() {};
    function isMobile() {
      return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    }
  </script>
</head>
<body>

  <canvas></canvas>

  <!-- script.js requires these DOM elements or it throws -->
  <div class="promo" style="display:none!important">
    <div class="promo-middle">
      <div class="promo-content">
        <div class="promo-header"><span class="promo-close"></span></div>
        <div class="promo-body">
          <div class="links-container">
            <a id="apple_link"></a>
            <a id="google_link"></a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    /* Apply calm config AFTER script.js sets up `config` */
    (function patchConfig() {
      if (typeof config === 'undefined') {
        // retry once (async dat.gui might delay init)
        return setTimeout(patchConfig, 100);
      }
      config.DENSITY_DISSIPATION   = 3.2;
      config.VELOCITY_DISSIPATION  = 2.0;
      config.PRESSURE              = 0.1;
      config.CURL                  = 14;
      config.SPLAT_RADIUS          = 0.20;
      config.SPLAT_FORCE           = 5000;
      config.BACK_COLOR            = { r: 10, g: 10, b: 15 };
      config.COLORFUL              = true;
      config.BLOOM_INTENSITY       = 0.40;
    })();

    /* Splash command from parent */
    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'SPLASH' && typeof multipleSplats === 'function') {
        multipleSplats(Math.floor(Math.random() * 5) + 4);
      }
    });

    /* ESC → tell parent */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') window.parent.postMessage({ type: 'RELAX_ESC' }, '*');
    });

    /* Signal ready */
    window.addEventListener('load', function() {
      window.parent.postMessage({ type: 'FLUID_READY' }, '*');
    });
  </script>
</body>
</html>
