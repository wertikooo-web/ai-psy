<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Звуки · Линии жизни</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #EDE8DF;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      pointer-events: none;
      z-index: 10;
    }

    #hint {
      color: rgba(100, 82, 62, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    #hint kbd {
      background: rgba(100, 82, 62, 0.1);
      border: 1px solid rgba(100, 82, 62, 0.18);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }

    #close {
      position: fixed;
      top: 10px; right: 14px;
      width: 34px; height: 34px;
      border-radius: 9px;
      background: rgba(100, 82, 62, 0.08);
      border: 1px solid rgba(100, 82, 62, 0.14);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: rgba(100, 82, 62, 0.45);
      font-size: 18px; line-height: 1;
      z-index: 10;
      pointer-events: auto;
      transition: background 150ms;
      font-family: sans-serif;
    }
    #close:hover { background: rgba(100, 82, 62, 0.16); color: rgba(100, 82, 62, 0.7); }

    #counter {
      position: fixed;
      bottom: 18px; right: 18px;
      color: rgba(100, 82, 62, 0.3);
      font-family: ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      z-index: 10;
      pointer-events: none;
    }

    #intro {
      position: fixed;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      color: rgba(100, 82, 62, 0.38);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      letter-spacing: 0.03em;
      z-index: 10;
      pointer-events: none;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>

  <div id="ui">
    <span id="hint">Нажмите <kbd>ESC</kbd> для возврата</span>
  </div>
  <button id="close" title="Закрыть">×</button>
  <div id="counter"></div>
  <div id="intro">Кликните на холст, чтобы разместить ноту</div>

  <canvas id="c"></canvas>

  <script>
  'use strict';

  // ── Canvas setup ──────────────────────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const counter = document.getElementById('counter');
  const intro   = document.getElementById('intro');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Close / ESC ───────────────────────────────────────────────────────────────
  document.getElementById('close').addEventListener('click', () => window.close());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });

  // ── Web Audio API ─────────────────────────────────────────────────────────────
  let ac   = null;
  let reverb = null;
  let masterGain = null;

  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();

    // Master gain
    masterGain = ac.createGain();
    masterGain.gain.value = 0.55;

    // Simple convolution reverb from impulse noise
    reverb = ac.createConvolver();
    const sr = ac.sampleRate;
    const len = sr * 2.4;
    const buf = ac.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      }
    }
    reverb.buffer = buf;

    const reverbGain = ac.createGain();
    reverbGain.gain.value = 0.38;

    masterGain.connect(ac.destination);
    reverb.connect(reverbGain);
    reverbGain.connect(ac.destination);
  }

  // Pentatonic scale: C4 D4 E4 G4 A4 C5 D5 E5
  const FREQS = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

  function playZen(freq) {
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();

    const now = ac.currentTime;

    // Main tone — sine
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    // Overtone — triangle at 2× for warmth
    const osc2 = ac.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, now);

    const g  = ac.createGain();
    const g2 = ac.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.22, now + 0.025);
    g.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

    g2.gain.setValueAtTime(0, now);
    g2.gain.linearRampToValueAtTime(0.06, now + 0.015);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

    osc.connect(g);
    osc2.connect(g2);
    g.connect(masterGain);
    g.connect(reverb);
    g2.connect(masterGain);
    g2.connect(reverb);

    osc.start(now);  osc.stop(now + 2.3);
    osc2.start(now); osc2.stop(now + 1.5);
  }

  // ── Color palette ─────────────────────────────────────────────────────────────
  // Warm, slightly luminous — pops on linen
  const PALETTES = [
    { light: '#FF8FAA', mid: '#E85F80', glow: 'rgba(232,95,128,' },  // rose
    { light: '#82C8F0', mid: '#4A9FD4', glow: 'rgba(74,159,212,' },  // sky
    { light: '#B4E8A0', mid: '#6DBF52', glow: 'rgba(109,191,82,' },  // mint
    { light: '#C8A8FF', mid: '#9A6EE8', glow: 'rgba(154,110,232,' }, // lavender
    { light: '#FFD07A', mid: '#F0A020', glow: 'rgba(240,160,32,' },  // amber
    { light: '#FF9F7A', mid: '#E8703A', glow: 'rgba(232,112,58,' },  // coral
    { light: '#7AE8D8', mid: '#3ABFAC', glow: 'rgba(58,191,172,' },  // teal
  ];

  // Each FREQ index maps to a palette
  const FREQ_PAL = [0, 4, 2, 3, 1, 0, 4, 2];

  // ── Ripple ────────────────────────────────────────────────────────────────────
  class Ripple {
    constructor(x, y, startR, pal) {
      this.x = x; this.y = y;
      this.r = startR;
      this.opacity = 0.65;
      this.pal = pal;
    }
    update() {
      this.r       += 2.2;
      this.opacity *= 0.93;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.strokeStyle = this.pal.glow + this.opacity + ')';
      ctx.lineWidth   = 2;
      ctx.stroke();

      // Outer faint ring
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = this.pal.glow + (this.opacity * 0.3) + ')';
      ctx.lineWidth   = 1;
      ctx.stroke();
    }
    get alive() { return this.opacity > 0.02; }
  }

  // ── Note ──────────────────────────────────────────────────────────────────────
  let noteSerial = 0;

  class Note {
    constructor(x, y, freqIdx) {
      this.id      = noteSerial++;
      this.x       = x;
      this.y       = y;
      this.freqIdx = freqIdx;
      this.freq    = FREQS[freqIdx];
      this.pal     = PALETTES[FREQ_PAL[freqIdx]];
      this.r       = 26 + Math.random() * 16;
      this.opacity = 0;
      this.fading  = false;
      this.ripples = [];
      this.pulseT  = 0;  // gentle breathe animation
    }

    trigger(particlePal) {
      this.ripples.push(new Ripple(this.x, this.y, this.r, particlePal));
      this.pulseT = 1;
    }

    update() {
      // Fade in
      if (!this.fading && this.opacity < 1) {
        this.opacity = Math.min(1, this.opacity + 0.05);
      }
      // Fade out
      if (this.fading) {
        this.opacity = Math.max(0, this.opacity - 0.018);
      }
      // Pulse decay
      if (this.pulseT > 0) this.pulseT = Math.max(0, this.pulseT - 0.04);

      this.ripples = this.ripples.filter(r => r.alive);
      this.ripples.forEach(r => r.update());
    }

    draw() {
      const op   = this.opacity;
      const p    = this.pal;
      const r    = this.r + this.pulseT * 6;

      // Ripples first (behind note)
      this.ripples.forEach(r2 => r2.draw());

      // Outer halo
      const halo = ctx.createRadialGradient(this.x, this.y, r * 0.7, this.x, this.y, r * 2.2);
      halo.addColorStop(0, p.glow + (op * 0.18) + ')');
      halo.addColorStop(1, p.glow + '0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, r * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = halo;
      ctx.fill();

      // Fill
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fillStyle = p.glow + (op * 0.14) + ')';
      ctx.fill();

      // Ring
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = p.glow + (op * 0.75) + ')';
      ctx.lineWidth   = 1.8;
      ctx.stroke();

      // Inner shimmer (highlight top-left)
      const shine = ctx.createRadialGradient(
        this.x - r * 0.3, this.y - r * 0.3, 0,
        this.x, this.y, r
      );
      shine.addColorStop(0, 'rgba(255,255,255,' + (op * 0.3) + ')');
      shine.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fillStyle = shine;
      ctx.fill();

      // Frequency dot (center)
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = p.glow + (op * 0.6) + ')';
      ctx.fill();
    }

    get dead() { return this.fading && this.opacity < 0.01; }
  }

  // ── Particle ──────────────────────────────────────────────────────────────────
  let particleSerial = 0;
  const PARTICLE_COUNT = 6;
  const TRAIL_LEN      = 18;

  class Particle {
    constructor() {
      this.id  = particleSerial++;
      this.pal = PALETTES[this.id % PALETTES.length];

      // Orbit params
      this.cx   = W * 0.2 + Math.random() * W * 0.6;
      this.cy   = H * 0.2 + Math.random() * H * 0.6;
      this.orbitR   = 70 + Math.random() * 110;
      this.orbitSpd = (0.35 + Math.random() * 0.45) * (Math.random() < 0.5 ? 1 : -1);
      this.phase    = Math.random() * Math.PI * 2;
      this.phase2   = Math.random() * Math.PI * 2; // secondary lissajous
      this.spd2     = this.orbitSpd * (1.5 + Math.random() * 0.8); // irrational ratio
      this.amp2     = 30 + Math.random() * 40;

      // Center drift
      this.dvx = (Math.random() - 0.5) * 0.28;
      this.dvy = (Math.random() - 0.5) * 0.28;

      this.r    = 5 + Math.random() * 2.5;
      this.trail = [];

      this.hitCooldowns = new Map(); // noteId → timestamp
      this._updatePos();
    }

    _updatePos() {
      this.x = this.cx
        + Math.cos(this.phase)  * this.orbitR
        + Math.sin(this.phase2) * this.amp2;
      this.y = this.cy
        + Math.sin(this.phase)  * this.orbitR
        + Math.cos(this.phase2 * 0.7) * this.amp2 * 0.6;
    }

    update(dt) {
      // Save trail
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > TRAIL_LEN) this.trail.shift();

      // Advance orbits
      this.phase  += this.orbitSpd * dt;
      this.phase2 += this.spd2     * dt;

      // Drift center
      this.cx += this.dvx;
      this.cy += this.dvy;

      // Soft wall bounce for center
      const margin = 120;
      if (this.cx < margin || this.cx > W - margin) this.dvx *= -1;
      if (this.cy < margin || this.cy > H - margin) this.dvy *= -1;
      this.cx = Math.max(margin, Math.min(W - margin, this.cx));
      this.cy = Math.max(margin, Math.min(H - margin, this.cy));

      this._updatePos();
    }

    canHit(noteId) {
      const now = Date.now();
      const last = this.hitCooldowns.get(noteId) || 0;
      return now - last > 700;
    }

    registerHit(noteId) {
      this.hitCooldowns.set(noteId, Date.now());
    }

    draw() {
      // Trail
      const tlen = this.trail.length;
      for (let i = 0; i < tlen; i++) {
        const t   = this.trail[i];
        const frac = i / tlen;
        const r2  = this.r * frac * 0.7;
        if (r2 < 0.5) continue;
        ctx.beginPath();
        ctx.arc(t.x, t.y, r2, 0, Math.PI * 2);
        ctx.fillStyle = this.pal.glow + (frac * 0.35) + ')';
        ctx.fill();
      }

      // Glow halo
      const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 4.5);
      glow.addColorStop(0,   this.pal.glow + '0.45)');
      glow.addColorStop(0.4, this.pal.glow + '0.18)');
      glow.addColorStop(1,   this.pal.glow + '0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 4.5, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      // Core white
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      // Colored center
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 0.65, 0, Math.PI * 2);
      ctx.fillStyle = this.pal.mid;
      ctx.fill();
    }
  }

  // ── State ─────────────────────────────────────────────────────────────────────
  const MAX_NOTES = 10;
  let notes     = [];
  let particles = [];
  let freqCursor = 0;
  let introShown = true;

  // Init particles after first resize
  function initParticles() {
    particles = Array.from({ length: PARTICLE_COUNT }, () => new Particle());
  }
  initParticles();

  // ── Add note ──────────────────────────────────────────────────────────────────
  function addNote(x, y) {
    initAudio();

    // Fade out oldest active note if at limit
    const active = notes.filter(n => !n.fading);
    if (active.length >= MAX_NOTES) {
      active[0].fading = true;
    }

    const freqIdx = freqCursor % FREQS.length;
    freqCursor++;
    notes.push(new Note(x, y, freqIdx));

    // Hide intro tip after first note
    if (introShown) {
      introShown = false;
      intro.style.opacity = '0';
    }
  }

  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    addNote(e.clientX - r.left, e.clientY - r.top);
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
      addNote(t.clientX - r.left, t.clientY - r.top);
    });
  }, { passive: false });

  // ── Collision ─────────────────────────────────────────────────────────────────
  function checkCollisions() {
    for (const p of particles) {
      for (const n of notes) {
        if (n.fading) continue;
        const dx   = p.x - n.x;
        const dy   = p.y - n.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < n.r && p.canHit(n.id)) {
          p.registerHit(n.id);
          playZen(n.freq);
          n.trigger(p.pal);
        }
      }
    }
  }

  // ── Background ────────────────────────────────────────────────────────────────
  function drawBg() {
    // Linen base
    ctx.fillStyle = '#EDE8DF';
    ctx.fillRect(0, 0, W, H);

    // Subtle center glow (warm cream)
    const cg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.6);
    cg.addColorStop(0, 'rgba(255,252,244,0.55)');
    cg.addColorStop(1, 'rgba(255,252,244,0)');
    ctx.fillStyle = cg;
    ctx.fillRect(0, 0, W, H);

    // Vignette
    const vg = ctx.createRadialGradient(W/2, H/2, H * 0.28, W/2, H/2, H * 0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.07)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ── Main loop ─────────────────────────────────────────────────────────────────
  let lastT = 0;

  function loop(ts) {
    const dt = Math.min((ts - lastT) / 1000, 0.05);
    lastT = ts;

    drawBg();

    // Notes
    notes = notes.filter(n => !n.dead);
    notes.forEach(n => { n.update(); n.draw(); });

    // Particles
    particles.forEach(p => p.update(dt));

    // Collisions
    checkCollisions();

    // Particles on top
    particles.forEach(p => p.draw());

    // Counter
    const active = notes.filter(n => !n.fading).length;
    counter.textContent = active > 0 ? `ноты: ${active} / ${MAX_NOTES}` : '';

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
  </script>
</body>
</html>
